<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cake Bakes | 3D Customizer</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Playfair+Display:wght@400;700&family=Quicksand:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Import Map for Three.js modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <style>
        h1, h2, h3, .brand-font { font-family: 'Pacifico', cursive; }
        body { font-family: 'Quicksand', sans-serif; }
        .serif { font-family: 'Playfair Display', serif; }
        
        /* Glassmorphism Panel */
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Custom Range Slider */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #db2777;
            margin-top: -6px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        
        /* Loading Overlay */
        #canvas-loader {
            position: absolute;
            inset: 0;
            background: #fdf2f8;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: opacity 0.5s;
        }

        /* Hide scrollbar for clean UI */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        
        /* Color Input Wrapper */
        .color-wrapper {
            width: 40px; 
            height: 40px; 
            border-radius: 50%; 
            overflow: hidden; 
            position: relative;
            border: 2px solid #e5e7eb;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            cursor: pointer;
        }
        .color-wrapper input {
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            cursor: pointer;
        }
    </style>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bakery: {
                            light: '#fff1f2',
                            main: '#fda4af',
                            dark: '#be123c',
                            accent: '#881337'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-rose-50 to-slate-100 text-slate-800 min-h-screen flex flex-col">

    <!-- Navigation -->
    <nav class="bg-white/80 backdrop-blur-md shadow-sm fixed w-full z-50 top-0 border-b border-pink-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-2">
                    <div class="w-10 h-10 bg-bakery-dark rounded-full flex items-center justify-center text-white shadow-lg">
                        <i class="fas fa-birthday-cake"></i>
                    </div>
                    <span class="brand-font text-2xl text-bakery-dark tracking-wide">Cake Bakes</span>
                </div>
                <div class="hidden md:flex space-x-8">
                    <a href="#" class="text-slate-500 hover:text-bakery-dark font-medium transition">Collections</a>
                    <a href="#" class="text-slate-500 hover:text-bakery-dark font-medium transition">Flavors</a>
                    <a href="#" class="text-bakery-dark font-bold border-b-2 border-bakery-dark">3D Studio</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow pt-20 pb-8 px-4 h-screen flex flex-col md:flex-row gap-6 max-w-7xl mx-auto w-full">
        
        <!-- LEFT: 3D Canvas Area -->
        <div class="w-full md:w-2/3 relative bg-white rounded-3xl shadow-2xl overflow-hidden border border-pink-100 flex flex-col">
            
            <!-- Canvas Container -->
            <div id="canvas-container" class="relative flex-grow w-full h-full cursor-move">
                <div id="canvas-loader">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-bakery-dark"></div>
                </div>
            </div>

            <!-- View Controls (Floating) -->
            <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 flex gap-2 bg-white/90 backdrop-blur px-2 py-2 rounded-full shadow-lg border border-gray-100">
                <button onclick="window.setCamera('iso')" class="p-2 rounded-full hover:bg-pink-50 text-gray-500 hover:text-bakery-dark tooltip" title="Reset View">
                    <i class="fas fa-cube"></i>
                </button>
                <button onclick="window.setCamera('top')" class="p-2 rounded-full hover:bg-pink-50 text-gray-500 hover:text-bakery-dark" title="Top View">
                    <i class="far fa-square"></i>

                <button onclick="window.setCamera('front')" class="p-2 rounded-full hover:bg-pink-50 text-gray-500 hover:text-bakery-dark" title="Side View">
                    <i class="fas fa-grip-lines"></i>
                </button>
                <div class="w-px bg-gray-300 mx-1"></div>
                <button onclick="window.toggleAutoRotate()" class="p-2 rounded-full hover:bg-pink-50 text-gray-500 hover:text-bakery-dark" id="rotate-btn">
                    <i class="fas fa-sync-alt"></i>

            </div>

            <!-- Price Tag (Floating) -->
            <div class="absolute top-6 right-6 bg-white/90 backdrop-blur-md px-6 py-3 rounded-2xl shadow-lg border border-pink-100 text-right">
                <p class="text-xs text-gray-500 font-bold uppercase tracking-wider">Estimated Total</p>
                <p id="price-display" class="text-3xl font-bold text-bakery-dark font-mono">$45.00</p>
            </div>
        </div>

        <!-- RIGHT: Customization Panel -->
        <div class="w-full md:w-1/3 flex flex-col gap-4 h-full overflow-y-auto pr-2 pb-20 md:pb-0">
            
            <div class="glass-panel p-6 rounded-3xl shadow-lg">
                <h2 class="serif text-2xl text-gray-800 mb-6 flex items-center gap-2">
                    <i class="fas fa-sliders-h text-bakery-dark text-lg"></i> Configuration
                </h2>

                <!-- Section 1: Structure -->
                <div class="space-y-6 border-b border-gray-200 pb-6 mb-6">
                    <h3 class="font-bold text-bakery-dark text-sm uppercase tracking-wider">Structure</h3>
                    
                    <!-- Shape & Tiers -->
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-xs font-bold text-gray-500 mb-2 block">Shape</label>
                            <div class="flex gap-2">
                                <button onclick="updateConfig('shape', 'round')" class="shape-btn flex-1 py-2 border border-bakery-dark bg-pink-50 rounded-lg transition" data-val="round"><i class="far fa-circle"></i></button>
                                <button onclick="updateConfig('shape', 'square')" class="shape-btn flex-1 py-2 border border-gray-200 bg-white rounded-lg transition" data-val="square"><i class="far fa-square"></i></button>
                            </div>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-gray-500 mb-2 block">Tiers</label>
                            <select onchange="updateConfig('tiers', this.value)" class="w-full p-2 border border-gray-200 rounded-lg bg-white text-sm">
                                <option value="1">1 Tier</option>
                                <option value="2">2 Tiers</option>

                    </div>

                    <!-- Size Slider -->
                    <div>
                        <div class="flex justify-between mb-2">

                </div>

                <!-- Section 2: Design & Colors -->
                <div class="space-y-6 border-b border-gray-200 pb-6 mb-6">
                    <h3 class="font-bold text-bakery-dark text-sm uppercase tracking-wider">Design & Colors</h3>

                    <!-- Frosting Style -->
                    <div class="grid grid-cols-4 gap-2">
                        <button onclick="updateConfig('design', 'smooth')" class="design-btn p-2 border border-bakery-dark bg-pink-50 rounded-lg text-xs font-bold text-bakery-dark" data-val="smooth">Smooth</button>
                        <button onclick="updateConfig('design', 'vintage')" class="design-btn p-2 border border-gray-200 bg-white rounded-lg text-xs text-gray-600" data-val="vintage">Vintage</button>
                        <button onclick="updateConfig('design', 'drip')" class="design-btn p-2 border border-gray-200 bg-white rounded-lg text-xs text-gray-600" data-val="drip">Drip</button>

                                <button onclick="updateConfig('color', '#ffffff')" class="w-8 h-8 rounded-full border bg-white hover:scale-110 transition"></button>

                        </div>
                        <div>

                            <div class="flex gap-2">
                                <div class="color-wrapper" title="Custom Accent Color">
                                    <input type="color" id="accentColorInput" value="#3e2723" oninput="updateConfig('accentColor', this.value)">
                                </div>
                                <button onclick="updateConfig('accentColor', '#3e2723')" class="w-8 h-8 rounded-full border hover:scale-110 transition" style="background:#3e2723"></button>
                                <button onclick="updateConfig('accentColor', '#ffd700')" class="w-8 h-8 rounded-full border hover:scale-110 transition" style="background:#ffd700"></button>
                            </div>

                    </div>

                    <!-- Toppings -->

                    <div class="grid grid-cols-2 gap-4">

    <!-- Main Logic Script (Module) -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

        // --- State Management ---
        const state = {
            tiers: 1,
            size: 8,
            design: 'smooth',
            shape: 'round',
            toppings: 'none',
            color: '#ffffff',
            accentColor: '#3e2723', // Default Chocolate
            message: '',
            fontFamily: 'Pacifico',
            fontSize: 70,
            fontColor: '#831843',
            price: 45
        };

        // --- Three.js Setup ---
        const container = document.getElementById('canvas-container');
        const loader = document.getElementById('canvas-loader');
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xfdf2f8);
        scene.fog = new THREE.Fog(0xfdf2f8, 20, 60);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(15, 12, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 8;
        controls.maxDistance = 40;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.0;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.set(2048, 2048);
        dirLight.shadow.bias = -0.0001;
        scene.add(dirLight);

        const backLight = new THREE.DirectionalLight(0xffdbe6, 1.0);
        backLight.position.set(-10, 5, -10);
        scene.add(backLight);

        const planeGeometry = new THREE.PlaneGeometry(100, 100);
        const planeMaterial = new THREE.ShadowMaterial({ opacity: 0.1 });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        plane.receiveShadow = true;
        scene.add(plane);

        // --- Procedural Textures ---
        function createNoiseTexture() {
            const size = 512;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#808080';
            ctx.fillRect(0,0,size,size);
            for(let i=0; i<5000; i++) {
                const x = Math.random() * size;
                const y = Math.random() * size;
                const r = Math.random() * 2;
                ctx.fillStyle = Math.random() > 0.5 ? '#909090' : '#707070';
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI*2);
                ctx.fill();
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }
        const bumpMap = createNoiseTexture();

        // --- Materials ---
        const frostingMaterial = new THREE.MeshPhysicalMaterial({
            color: state.color,
            roughness: 0.5,
            metalness: 0.05,
            clearcoat: 0.3,
            clearcoatRoughness: 0.4,
            bumpMap: bumpMap,
            bumpScale: 0.02
        });

        const boardMaterial = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            roughness: 0.2,
            metalness: 0.1
        });
        
        // Material for Drips and Accent Details
        const accentMaterial = new THREE.MeshPhysicalMaterial({
            color: state.accentColor,
            roughness: 0.3,
            metalness: 0.0,
            clearcoat: 0.8
        });

        const strawberryMat = new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.3 });
        const leafMat = new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.6 });
        const waxMat = new THREE.MeshStandardMaterial({ color: 0xfcd34d, roughness: 0.4 });
        const macaronMat = new THREE.MeshStandardMaterial({ color: 0xf472b6, roughness: 0.5 });

        // --- Cake Generation ---
        let cakeGroup = new THREE.Group();
        scene.add(cakeGroup);

        function createTextTexture(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0,0,canvas.width, canvas.height);
            
            if(text) {
                // Dynamic Font Loading
                ctx.font = `bold ${state.fontSize}px "${state.fontFamily}", sans-serif`;
                ctx.fillStyle = state.fontColor;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                // Subtle shadow to make it pop
                ctx.shadowColor = "rgba(255, 255, 255, 0.5)";
                ctx.shadowBlur = 2;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;
                
                ctx.fillText(text, canvas.width / 2, canvas.height / 2);
            }
            return new THREE.CanvasTexture(canvas);
        }

        function generateCake() {
            // Cleanup
            while(cakeGroup.children.length > 0){ 
                const child = cakeGroup.children[0];
                if(child.geometry) child.geometry.dispose();
                cakeGroup.remove(child); 
            }

            // Update Materials
            frostingMaterial.color.set(state.color);
            accentMaterial.color.set(state.accentColor);

            const baseRadius = state.size / 2; 
            const tierHeight = 2.5;
            const scaleFactor = state.shape === 'square' ? 0.8 : 0.75;

            // 1. Board
            const boardSize = baseRadius + 2.5;
            let boardGeo;
            if (state.shape === 'round') {
                boardGeo = new THREE.CylinderGeometry(boardSize, boardSize, 0.2, 64);
            } else {
                boardGeo = new RoundedBoxGeometry(boardSize*2, 0.2, boardSize*2, 4, 1);
            }
            const boardMesh = new THREE.Mesh(boardGeo, boardMaterial);
            boardMesh.position.y = 0.1;
            boardMesh.receiveShadow = true;
            cakeGroup.add(boardMesh);

            // 2. Tiers
            let currentRadius = baseRadius;
            let currentY = 0.2; 

            for (let i = 0; i < state.tiers; i++) {
                const h = tierHeight;
                const r = currentRadius;
                let mesh;

                if (state.shape === 'round') {
                    const geo = new THREE.CylinderGeometry(r, r, h, 64);
                    mesh = new THREE.Mesh(geo, frostingMaterial);
                } else {
                    const width = r * 2;
                    const geo = new RoundedBoxGeometry(width, h, width, 4, 0.5);
                    mesh = new THREE.Mesh(geo, frostingMaterial);
                }

                mesh.position.y = currentY + h / 2;
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                cakeGroup.add(mesh);

                // -- Design Elements --
                if (state.design === 'vintage') {
                    if(state.shape === 'round') {
                        const pipeGeo = new THREE.TorusGeometry(r, 0.1, 16, 80);
                        const pipeTop = new THREE.Mesh(pipeGeo, frostingMaterial); // Vintage usually matches frosting
                        pipeTop.rotation.x = Math.PI/2;
                        pipeTop.position.y = currentY + h;
                        cakeGroup.add(pipeTop);
                        
                        const pipeBot = pipeTop.clone();
                        pipeBot.position.y = currentY + 0.15;
                        cakeGroup.add(pipeBot);
                    } else {
                        const w = r * 2;
                        const pipeGeo = new RoundedBoxGeometry(w, 0.15, w, 2, 0.07);
                        const pipeTop = new THREE.Mesh(pipeGeo, frostingMaterial);
                        pipeTop.position.y = currentY + h;
                        cakeGroup.add(pipeTop);
                    }
                }

                if (state.design === 'pearls' && state.shape === 'round') {
                    const pearlCount = Math.floor(r * 10);
                    for(let p=0; p<pearlCount; p++) {
                        const angle = (p / pearlCount) * Math.PI * 2;
                        const pX = Math.cos(angle) * (r + 0.1);
                        const pZ = Math.sin(angle) * (r + 0.1);
                        // Pearls now use Accent Color (white default but user can change to gold etc)
                        const pearl = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), accentMaterial);
                        pearl.position.set(pX, currentY + 0.12, pZ);
                        cakeGroup.add(pearl);
                    }
                }

                if (state.design === 'drip') {
                    // Drip now uses accentColor (Chocolate default)
                    if (state.shape === 'round') {
                         const dripGeo = new THREE.CylinderGeometry(r + 0.02, r + 0.02, 0.3, 64);
                         const dripMesh = new THREE.Mesh(dripGeo, accentMaterial);
                         dripMesh.position.y = currentY + h;
                         cakeGroup.add(dripMesh);

                         const dripCount = Math.floor(r * 4);
                         for(let d=0; d<dripCount; d++) {
                             if (Math.random() > 0.3) {
                                 const angle = (d / dripCount) * Math.PI * 2;
                                 const dX = Math.cos(angle) * (r + 0.02);
                                 const dZ = Math.sin(angle) * (r + 0.02);
                                 const len = Math.random() * (h * 0.6);
                                 const drop = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, len, 8), accentMaterial);
                                 drop.position.set(dX, currentY + h - len/2, dZ);
                                 cakeGroup.add(drop);
                             }
                         }
                    } else {
                        const w = r * 2 + 0.05;
                        const dripGeo = new RoundedBoxGeometry(w, 0.3, w, 4, 0.1);
                        const dripMesh = new THREE.Mesh(dripGeo, accentMaterial);
                        dripMesh.position.y = currentY + h;
                        cakeGroup.add(dripMesh);
                    }
                }

                // -- Toppings (Top Tier Only) --
                if (i === state.tiers - 1 && state.toppings !== 'none') {
                    const topY = currentY + h;
                    
                    if (state.toppings === 'strawberries') {
                        for(let k=0; k<5; k++){
                            const angle = (k/5)*Math.PI*2;
                            const sx = Math.cos(angle)*0.8;
                            const sz = Math.sin(angle)*0.8;
                            const sMesh = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.8, 16), strawberryMat);
                            sMesh.position.set(sx, topY + 0.4, sz);
                            cakeGroup.add(sMesh);
                            const lMesh = new THREE.Mesh(new THREE.CylinderGeometry(0, 0.2, 0.2, 5), leafMat);
                            lMesh.position.set(sx, topY + 0.8, sz);
                            cakeGroup.add(lMesh);
                        }
                    } else if (state.toppings === 'candles') {
                        const cMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 1.5, 16), waxMat);
                        cMesh.position.set(0, topY + 0.75, 0);
                        cakeGroup.add(cMesh);
                        const flame = new THREE.PointLight(0xffaa00, 1, 2);
                        flame.position.set(0, topY + 1.6, 0);
                        cakeGroup.add(flame);
                        const wick = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.2, 0.02), new THREE.MeshBasicMaterial({color:0x000000}));
                        wick.position.set(0, topY+1.6, 0);
                        cakeGroup.add(wick);
                    } else if (state.toppings === 'macarons') {
                        for(let k=0; k<6; k++){
                            const angle = (k/6)*Math.PI*2;
                            const mx = Math.cos(angle)*(r-0.8);
                            const mz = Math.sin(angle)*(r-0.8);
                            const mac = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16), macaronMat);
                            mac.rotation.x = Math.PI/2;
                            mac.rotation.z = angle;
                            mac.position.set(mx, topY + 0.2, mz);
                            cakeGroup.add(mac);
                        }
                    }
                }

                currentY += h;
                currentRadius *= scaleFactor;
            }

            // 3. Text Message
            if (state.message) {
                const textTex = createTextTexture(state.message);
                
                if (state.tiers === 1) {
                    const labelW = state.size * 0.8;
                    const labelH = labelW / 4;
                    const labelGeo = new THREE.PlaneGeometry(labelW, labelH);
                    const labelMat = new THREE.MeshBasicMaterial({ map: textTex, transparent: true, opacity: 1.0 });
                    const labelMesh = new THREE.Mesh(labelGeo, labelMat);
                    
                    const topY = 0.2 + tierHeight;
                    labelMesh.position.set(0, topY + 0.02, 0);
                    labelMesh.rotation.x = -Math.PI / 2;
                    if(state.toppings !== 'none') labelMesh.position.z = baseRadius * 0.4;

                    cakeGroup.add(labelMesh);
                } else {
                    // Side Text for Tiered Cakes
                    const bottomR = baseRadius;
                    const labelH = 1.5; 
                    let labelMesh;
                    const labelMat = new THREE.MeshBasicMaterial({ map: textTex, transparent: true });

                    if (state.shape === 'round') {
                        const radius = bottomR + 0.06;
                        const thetaLength = Math.PI / 2; 
                        const curvedGeo = new THREE.CylinderGeometry(radius, radius, labelH, 32, 1, true, -thetaLength/2, thetaLength);
                        labelMesh = new THREE.Mesh(curvedGeo, labelMat);
                    } else {
                        const planeGeo = new THREE.PlaneGeometry(bottomR * 1.5, labelH);
                        labelMesh = new THREE.Mesh(planeGeo, labelMat);
                    }
                    const tierMidY = 0.2 + (tierHeight / 2);
                    labelMesh.position.y = tierMidY;
                    
                    if (state.shape === 'square') {
                        labelMesh.position.z = bottomR + 0.06; 
                    } else {
                        labelMesh.position.z = 0; 
                        labelMesh.rotation.y = 0;
                    }
                    cakeGroup.add(labelMesh);
                }
            }
        }

        // --- UI Helpers ---
        window.updateConfig = function(key, value) {
            if (key === 'size' || key === 'tiers' || key === 'fontSize') value = parseInt(value);
            state[key] = value;

            // UI Label Updates
            if (key === 'size') document.getElementById('size-label').innerText = value + " inches";
            if (key === 'fontSize') document.getElementById('fontsize-label').innerText = value + "px";
            
            // UI State Updates (Buttons)
            if (key === 'shape') {
                document.querySelectorAll('.shape-btn').forEach(btn => {
                    if (btn.dataset.val === value) {
                        btn.classList.replace('border-gray-200', 'border-bakery-dark');
                        btn.classList.replace('bg-white', 'bg-pink-50');
                    } else {
                        btn.classList.replace('border-bakery-dark', 'border-gray-200');
                        btn.classList.replace('bg-pink-50', 'bg-white');
                    }
                });
            }
            if (key === 'design') {
                document.querySelectorAll('.design-btn').forEach(btn => {
                    if (btn.dataset.val === value) {
                        btn.classList.replace('border-gray-200', 'border-bakery-dark');
                        btn.classList.replace('bg-white', 'bg-pink-50');
                        btn.classList.replace('text-gray-600', 'text-bakery-dark');
                        btn.classList.add('font-bold');
                    } else {
                        btn.classList.replace('border-bakery-dark', 'border-gray-200');
                        btn.classList.replace('bg-pink-50', 'bg-white');
                        btn.classList.replace('text-bakery-dark', 'text-gray-600');
                        btn.classList.remove('font-bold');
                    }
                });
            }

            // Price Calc
            let base = 30;
            base += (state.size - 6) * 5;
            base += (state.tiers - 1) * 25;
            if (state.design !== 'smooth') base += 15;
            if (state.toppings !== 'none') base += 8;
            document.getElementById('price-display').innerText = '$' + base.toFixed(2);

            generateCake();
        };

        // Camera API
        window.setCamera = function(view) {
            controls.autoRotate = false;
            const target = new THREE.Vector3(0, 0, 0);
            const startPos = camera.position.clone();
            let endPos;
            if (view === 'top') endPos = new THREE.Vector3(0, 25, 0.1);
            else if (view === 'front') endPos = new THREE.Vector3(0, 5, 25);
            else if (view === 'iso') endPos = new THREE.Vector3(15, 12, 15);

            let startTime = null;
            function anim(time) {
                if (!startTime) startTime = time;
                const progress = Math.min((time - startTime) / 800, 1);
                const ease = 1 - Math.pow(1 - progress, 4);
                camera.position.lerpVectors(startPos, endPos, ease);
                camera.lookAt(target);
                if (progress < 1) requestAnimationFrame(anim);
                else controls.update();
            }
            requestAnimationFrame(anim);
        };

        window.toggleAutoRotate = function() {
            controls.autoRotate = !controls.autoRotate;
            const btn = document.getElementById('rotate-btn');
            if(controls.autoRotate) btn.classList.add('text-bakery-dark');
            else btn.classList.remove('text-bakery-dark');
        }

        window.placeOrder = function() {
            alert(`Custom Order Confirmed!\n${state.size}" ${state.shape} ${state.tiers}-Tier\nMsg: "${state.message}"`);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        generateCake();
        animate();
        
        setTimeout(() => {
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 500);
        }, 800);

    </script>
</body>
</html>
